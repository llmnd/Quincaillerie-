name: quincaillerie-api

db:
  postgres:
    host: ${DATABASE_HOST}
    port: ${DATABASE_PORT}
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    database: ${POSTGRES_DB}

services:
  - name: api
    instance_type: micro
    ports:
      - port: 8000
        protocol: HTTP
    routes:
      - path: /
    docker:
      dockerfile: Dockerfile
      context: .
    env:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        value: ${DATABASE_URL}
      - key: SECRET_KEY
        value: ${SECRET_KEY}
      - key: CORS_ORIGINS
        value: ${CORS_ORIGINS}
      - key: PUBLIC_SITE_BASE_DOMAIN
        value: ${PUBLIC_SITE_BASE_DOMAIN}
      - key: PUBLIC_SITE_PROTOCOL
        value: https
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
